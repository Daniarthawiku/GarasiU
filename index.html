<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GARASIU ApexLog — Autentikasi Pemilik Kendaraan</title>

    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">
        <div class="login-card">

            <div class="card-header">
                <div class="badge-group">
                    <span class="label">Welcome Back to Garasiu</span>
                </div>
            </div>

            <div class="card-title">
                <h2>Enter your Garage</h2>
                <p>Access scheduled service history, fuel consumption analytics, and parts wear monitoring.</p>
            </div>


            <form id="loginForm">

                <div class="form-group">
                    <label for="identifier">Fill your Email</label>
                    <div class="input-wrapper">
                        <span class="material-symbols-outlined input-icon">alternate_email</span>
                        <input id="identifier" name="identifier" type="email" placeholder="karlbenz@gmail.com"
                            required>
                    </div>
                </div>

                <div class="form-group">
                    <div class="label-row">
                        <label for="password">Fill your Password</label>
                        <a href="#" class="forgot-link">FORGOT?</a>
                    </div>
                    <div class="input-wrapper">
                        <span class="material-symbols-outlined input-icon">lock</span>
                        <input id="password" name="password" type="password" placeholder="••••••••••••" required>
                        <button type="button" class="btn-toggle-pwd" onclick="togglePasswordVisibility()">
                            <span class="material-symbols-outlined" id="togglePasswordIcon">visibility</span>
                        </button>
                    </div>
                </div>

                <div class="remember-row">
                    <label class="checkbox-container">
                        <input id="rememberDevice" type="checkbox">
                        <span class="checkbox-text">Remember Me</span>
                    </label>
                </div>

                <button class="btn-primary" type="submit">
                    <span class="material-symbols-outlined">login</span>
                    <span>Get In</span>
                </button>
            </form>


            <div class="card-footer">
                <p>Didnt had an account? <a href="#">Create New</a></p>
            </div>
        </div>
    </main>
</body>
</html>
